<anvil-form container="ColumnPanel" prop:col_widths='"{\"LRCORD\":5,\"LRCWHT\":17,\"LRCQTY\":4,\"LRCSHP\":6,\"LRCLOD\":7,\"LRCSTA\":8,\"LRCACT\":13}"'>
  <anvil-component type="Label" name="lbl_order" prop:bold="true" container:grid_position="LROW01,LRCORD"></anvil-component>
  <anvil-component type="ColumnPanel" name="pnl_what" container:grid_position="LROW01,LRCWHT">
    <anvil-component type="Label" name="lbl_what" prop:bold="true" container:grid_position="LWROW01,LWCOL01"></anvil-component>
    <anvil-component type="Label" name="lbl_sub" prop:font_size="13" prop:foreground="#595959" container:grid_position="LWROW02,LWCOL02"></anvil-component>
    <anvil-component type="Link" name="lk_drift" prop:font_size="13" prop:foreground="#B45309" prop:visible="false" container:grid_position="LWROW03,LWCOL03"></anvil-component>
  </anvil-component>
  <anvil-component type="Label" name="lbl_qty" prop:align="right" container:grid_position="LROW01,LRCQTY"></anvil-component>
  <anvil-component type="Label" name="lbl_shipby" container:grid_position="LROW01,LRCSHP"></anvil-component>
  <anvil-component type="Label" name="lbl_load" prop:align="right" prop:bold="true" container:grid_position="LROW01,LRCLOD"></anvil-component>
  <anvil-component type="Label" name="lbl_status" container:grid_position="LROW01,LRCSTA"></anvil-component>
  <anvil-component type="FlowPanel" name="flow_row_actions" prop:align="right" prop:vertical_align="center" container:grid_position="LROW01,LRCACT">
    <anvil-component type="Button" name="btn_refresh" prop:text="↻" prop:role="outlined-button"></anvil-component>
    <anvil-component type="Button" name="btn_snooze" prop:text="⏰" prop:role="outlined-button"></anvil-component>
    <anvil-component type="Button" name="btn_remove" prop:text="✕" prop:role="outlined-button" prop:foreground="#C62828"></anvil-component>
  </anvil-component>
</anvil-form>
