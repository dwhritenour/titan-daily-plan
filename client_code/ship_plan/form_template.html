<anvil-form container="HtmlTemplate" prop:html="@theme:standard-page.html">
  <anvil-component type="ColumnPanel" name="content_panel" container:slot="default">
    <!-- Header row -->
    <anvil-component type="ColumnPanel" name="oc_header" prop:role="outlined-card" container:grid_position="PYRLDT,YCVAIH" container:full_width_row="true">
      <anvil-component type="FlowPanel" name="flow_header" prop:align="left" prop:vertical_align="center" container:grid_position="RXXQJB,BSMAWY" container:full_width_row="true">
        <anvil-component type="DatePicker" name="dp_plan_date" prop:pick_time="false"></anvil-component>
        <anvil-component type="Label" name="lbl_plan_status" prop:bold="true"></anvil-component>
        <anvil-component type="Button" name="btn_publish" prop:text="Publish" prop:role="elevated-button"></anvil-component>
        <anvil-component type="Link" name="lk_history" prop:text="History"></anvil-component>
        <anvil-component type="Link" name="lk_params" prop:text="Parameters"></anvil-component>
        <anvil-component type="Link" name="lk_overrides" prop:text="Assembler Overrides" prop:align="center" prop:bold="false" prop:spacing='{"margin":["5",null,"0",null]}'></anvil-component>
      </anvil-component>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="oc_capacity" prop:role="outlined-card" prop:col_widths='"{\"DGKFXL\":20,\"ZZJRPK\":20,\"DAHJIG\":15}"' container:grid_position="LYNGOP,YRRSCO" container:full_width_row="true">
      <anvil-component type="Label" name="lbl_capacity_line" prop:bold="true" prop:font_size="20" prop:spacing='{"padding":[null,null,"0",null],"margin":[null,null,"0",null]}' container:grid_position="YFOEIC,KHYCKZ" container:full_width_row="true"></anvil-component>
      <anvil-component type="Label" name="label_2" prop:text="(measures work, not product length)" prop:italic="true" prop:spacing='{"margin":["-5",null,"10",null],"padding":["0",null,"0",null]}' container:grid_position="LIJOLV,ORFYXA" container:full_width_row="true"></anvil-component>
      <anvil-component type="Label" name="lbl_feed_note" prop:font_size="13" prop:foreground="#595959" prop:visible="false" prop:background="#FCF3D9" prop:align="center" prop:bold="true" prop:spacing='{"margin":["0",null,"0",null]}' container:grid_position="YPKEON,KABDSH" container:full_width_row="true"></anvil-component>
      <anvil-component type="Label" name="lbl_snapshot_warn" prop:visible="false" prop:foreground="#a16207" prop:background="#FCF3D9" prop:align="center" prop:bold="true" prop:spacing='{"margin":["0",null,"0",null]}' container:grid_position="YPKEON,DGKFXL" container:full_width_row="true"></anvil-component>
      <anvil-component type="Label" name="lbl_crew" prop:font_size="13" prop:foreground="#595959" prop:align="center" prop:bold="true" prop:background="#FCF3D9" prop:spacing='{"margin":["0",null,"0",null]}' container:grid_position="YPKEON,ZZJRPK"></anvil-component>
      <anvil-component type="Canvas" name="cv_capacity" prop:height="67.5" prop:margin='["5",null,"0",null]' container:grid_position="JPZSKA,ITYGHX" container:full_width_row="true"></anvil-component>
    </anvil-component>
    <!-- Capacity card -->
    <anvil-component type="ColumnPanel" name="oc_filters" prop:role="outlined-card" container:grid_position="CAPROW,CAPCOL" container:full_width_row="true">
      <anvil-component type="FlowPanel" name="flow_filters" prop:align="left" prop:vertical_align="center" container:grid_position="MRALAW,ETZAZP" container:full_width_row="true">
        <anvil-component type="TextBox" name="tb_search" prop:placeholder="order / SKU / ship-to"></anvil-component>
        <anvil-component type="DropDown" name="dd_bucket" prop:include_placeholder="true" prop:placeholder="All product" container:width="204.5"></anvil-component>
        <anvil-component type="DropDown" name="dd_flag" container:width="351.5"></anvil-component>
        <anvil-component type="CheckBox" name="cb_due_window" prop:text="Due within horizon" prop:checked="true"></anvil-component>
        <anvil-component type="CheckBox" name="cb_special_only" prop:text="Non-Standard Only"></anvil-component>
        <anvil-component type="CheckBox" name="cb_defaulted_only" prop:text="Unclassified ⚠"></anvil-component>
        <anvil-component type="Link" name="btn_flag_legend" prop:text="View Flag Legend"></anvil-component>
      </anvil-component>
    </anvil-component>
    <!-- Filter row -->
    <!-- Two-pane body: candidates (60) / plan (40) -->
    <anvil-component type="ColumnPanel" name="pnl_body" prop:col_widths='"{\"LFTCOL\":30,\"RGTCOL\":30}"' prop:role="outlined-card" container:grid_position="BDYROW,BDYCOL" container:full_width_row="true">
      <anvil-component type="ColumnPanel" name="pnl_candidates" prop:role="outlined-card" container:grid_position="BODROW,LFTCOL" container:full_width_row="true">
        <anvil-component type="Label" name="lbl_candidates_header" prop:text="UP NEXT — CANDIDATES" prop:spacing='{"margin":["0",null,"0",null],"padding":["0",null,"0",null]}' prop:bold="true" container:grid_position="CANA01,CANB01" container:full_width_row="true"></anvil-component>
        <anvil-component type="DataGrid" name="dg_candidates" prop:role="tonal-data-grid" prop:auto_header="true" prop:rows_per_page="25" prop:show_page_controls="true" prop:columns='[{"id":"order","title":"Order","data_key":"order","width":"80"},{"id":"item","title":"Item","data_key":"item"},{"id":"qty","title":"Qty","data_key":"qty","width":60},{"id":"ship_by","title":"Ship By","data_key":"ship_by","width":"100"},{"id":"load","title":"Load","data_key":"load","width":"70"},{"id":"flags","title":"Flags","data_key":"flags","width":"160"},{"id":"add","title":"Add","data_key":"add","width":"90"}]' container:grid_position="CANA02,CANB02" container:full_width_row="true">
          <anvil-component type="RepeatingPanel" name="rp_candidates" prop:item_template="Titan_Daily_Plan.ship_plan.ShipPlanCandidateRow" prop:margin='["0",null,"0",null]' container:pinned="false"></anvil-component>
        </anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="pnl_plan" prop:role="outlined-card" container:grid_position="BODROW,RGTCOL">
        <anvil-component type="Label" name="lbl_plan_header" prop:text="THIS DAY'S PLAN" prop:bold="true" prop:spacing='{"margin":["0",null,"0",null],"padding":["0",null,"0",null]}' container:grid_position="PLNA01,PLNB01" container:full_width_row="true"></anvil-component>
        <anvil-component type="DataGrid" name="dg_plan_lines" prop:role="tonal-data-grid" prop:auto_header="true" prop:rows_per_page="25" prop:show_page_controls="true" prop:columns='[{"id":"order","title":"Order","data_key":"order","width":90},{"id":"item","title":"Item","data_key":"item"},{"id":"qty","title":"Qty","data_key":"qty","width":60},{"id":"ship_by","title":"Ship By","data_key":"ship_by","width":110},{"id":"load","title":"Load","data_key":"load","width":90},{"id":"status","title":"Status","data_key":"status","width":110},{"id":"actions","title":"Actions","data_key":"actions","width":"150"}]' container:grid_position="PLNA02,PLNB02" container:full_width_row="true">
          <anvil-component type="RepeatingPanel" name="rp_plan_lines" prop:item_template="Titan_Daily_Plan.ship_plan.ShipPlanLineRow" prop:margin='["0",null,"0",null]'></anvil-component>
        </anvil-component>
        <anvil-component type="CheckBox" name="cb_show_removed" prop:text="Show removed" prop:font_size="13" container:grid_position="PLNA04,PLNB04" container:full_width_row="true"></anvil-component>
      </anvil-component>
    </anvil-component>
    <!-- Read-only refresh tick -->
    <anvil-component type="Timer" name="timer_drift" prop:interval="300" container:grid_position="TMRROW,TMRCOL"></anvil-component>
  </anvil-component>
  <anvil-component type="Label" name="label_1" prop:text="Titan Daily Plan Board" prop:bold="true" prop:font_size="26" prop:icon="fa:dashcube" container:slot="title"></anvil-component>
</anvil-form>
