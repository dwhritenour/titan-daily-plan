<anvil-form container="HtmlTemplate" prop:html="@theme:standard-page.html">
  <anvil-component type="ColumnPanel" name="cp_form" container:slot="default">
    <!-- Header row: back-link, title, day picker, refresh, run-now -->
    <!-- Summary block -->
    <anvil-component type="ColumnPanel" name="oc_header" prop:role="outlined-card" container:grid_position="BTHGZQ,YWPFRM">
      <anvil-component type="FlowPanel" name="flow_header" prop:align="left" prop:vertical_align="center" prop:spacing='{"margin":["0",null,"5",null]}' container:grid_position="HRUZZS,NVGRGL">
        <anvil-component type="Link" name="lk_plan" prop:text="← Daily Plan" prop:bold="true" prop:spacing='{"margin":["6",null,"0",null]}'></anvil-component>
        <anvil-component type="Label" name="lbl_title" prop:text="Retro" prop:bold="true" prop:font_size="22" prop:spacing='{"margin":["6",null,"0",null],"padding":["0","10","0","10"]}'></anvil-component>
        <anvil-component type="DropDown" name="dd_day" container:width="277.5"></anvil-component>
        <anvil-component type="FlowPanel" name="flow_panel_1" prop:align="right" container:width="241.5">
          <anvil-component type="Link" name="lk_run" prop:text="Run Retro Now" prop:spacing='{"margin":["6",null,"0",null]}' prop:bold="true"></anvil-component>
          <anvil-component type="Button" name="btn_refresh" prop:text="Refresh" prop:role="outlined-button"></anvil-component>
        </anvil-component>
      </anvil-component>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="oc_summary" prop:role="outlined-card" container:grid_position="YZEJGS,YEJKOA">
      <anvil-component type="Label" name="lbl_summary" prop:bold="false" prop:spacing='{"margin":["5",null,"0",null],"padding":["0",null,"0",null]}' container:grid_position="JZTTTZ,NDLFRE"></anvil-component>
      <anvil-component type="Label" name="lbl_open" prop:bold="false" prop:spacing='{"margin":["0",null,"5",null],"padding":["0",null,"0",null]}' container:grid_position="XUBSWV,SBGEDI"></anvil-component>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="oc_narrative" prop:role="outlined-card" container:grid_position="VVMRGQ,LSCWVX">
      <anvil-component type="Link" name="lk_narrative" prop:text="Show narrative" prop:spacing='{"margin":["0",null,"0",null]}' container:grid_position="DQZCZO,GVOWUH"></anvil-component>
      <anvil-component type="TextArea" name="ta_narrative" prop:auto_expand="true" prop:enabled="false" prop:visible="false" prop:font_size="13" prop:role="outlined" prop:spacing='{"margin":["5",null,"5",null]}' container:grid_position="SPEWHJ,XRZOKL"></anvil-component>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="oc_user" prop:role="outlined-card" container:grid_position="GZWWEO,VYELPE">
      <anvil-component type="FlowPanel" name="flow_filters" prop:align="left" prop:vertical_align="center" prop:spacing='{"margin":["5",null,"5",null]}' container:grid_position="UBSECH,BDMAWE">
        <anvil-component type="Label" name="lbl_who_prompt" prop:text="I am:" prop:spacing='{"margin":["0",null,"0",null]}'></anvil-component>
        <anvil-component type="DropDown" name="dd_who" container:width="241.5"></anvil-component>
        <anvil-component type="Label" name="lbl_side_prompt" prop:text="Show:" prop:spacing='{"margin":["0",null,"0",null],"padding":["0","10","0","10"]}'></anvil-component>
        <anvil-component type="DropDown" name="dd_side" container:width="280"></anvil-component>
      </anvil-component>
    </anvil-component>
    <!-- Narrative: link toggles the read-only text area -->
    <!-- Viewer / side filters -->
    <!-- One card per open question -->
    <anvil-component type="RepeatingPanel" name="rp_questions" prop:item_template="Titan_Daily_Plan.retro.RetroQuestionRow" prop:spacing='{"margin":["0",null,"5",null]}' container:grid_position="RPQROW,RPQCOL" container:full_width_row="false"></anvil-component>
    <anvil-component type="ColumnPanel" name="outlined_card_1" prop:role="outlined-card" container:grid_position="LUJJGI,MFRQKE">
      <anvil-component type="Link" name="oc_no_question" prop:text="Show lines that need no question" prop:spacing='{"margin":["5",null,"0",null]}' container:grid_position="EIYKAR,SCASDU"></anvil-component>
    </anvil-component>
    <anvil-component type="ColumnPanel" name="oc_closed" prop:role="outlined-card" container:grid_position="BEJPKW,ZLBZEV">
      <anvil-component type="TextArea" name="ta_closed" prop:auto_expand="true" prop:enabled="false" prop:visible="false" prop:font_size="13" prop:role="outlined" prop:spacing='{"margin":["5",null,"10",null]}' container:grid_position="LVXJXR,KUGZGX"></anvil-component>
    </anvil-component>
    <!-- Closed / no-question lines: link toggles the read-only text area -->
  </anvil-component>
  <anvil-component type="Label" name="lbl_app_title" prop:text="Titan Daily Plan Retro" prop:bold="true" prop:font_size="26" prop:icon="fa:comments-o" container:slot="title"></anvil-component>
</anvil-form>
