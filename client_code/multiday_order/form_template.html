      <anvil-component type="DataGrid" name="dg_grid" prop:role="tonal-data-grid" prop:auto_header="true" prop:rows_per_page="25" prop:show_page_controls="false" prop:columns='[{"id":"line","title":"","data_key":"line","width":"210"},{"id":"d1","title":"Mon","data_key":"d1"},{"id":"d2","title":"Tue","data_key":"d2"},{"id":"d3","title":"Wed","data_key":"d3"},{"id":"d4","title":"Thu","data_key":"d4"},{"id":"d5","title":"Fri","data_key":"d5"}]' container:grid_position="MDGRDC,MDGRDD" container:full_width_row="true">
